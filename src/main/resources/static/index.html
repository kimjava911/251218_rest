<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CORS 테스트 - 상품 CRUD</title>
</head>
<body>
<h1>상품 API CRUD 테스트</h1>

<!-- 결과 메시지 -->
<div id="message"></div>

<!-- 상품 등록 폼 -->
<h2>상품 등록</h2>
<form id="createForm">
    <input type="text" id="createName" placeholder="상품명" required>
    <input type="number" id="createPrice" placeholder="가격" required min="0">
    <input type="text" id="createDesc" placeholder="설명">
    <button type="submit">등록</button>
</form>

<!-- 상품 수정 폼 -->
<h2>상품 수정</h2>
<form id="updateForm">
    <input type="number" id="updateId" placeholder="상품 ID" required min="1">
    <input type="text" id="updateName" placeholder="상품명" required>
    <input type="number" id="updatePrice" placeholder="가격" required min="0">
    <input type="text" id="updateDesc" placeholder="설명">
    <button type="submit">수정</button>
</form>

<!-- 상품 삭제 -->
<h2>상품 삭제</h2>
<form id="deleteForm">
    <input type="number" id="deleteId" placeholder="상품 ID" required min="1">
    <button type="submit">삭제</button>
</form>

<!-- 상품 목록 -->
<h2>상품 목록</h2>
<button onclick="fetchItems()">목록 조회</button>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>상품명</th>
        <th>가격</th>
        <th>설명</th>
    </tr>
    </thead>
    <tbody id="itemTableBody"></tbody>
</table>

<script>
    const API_BASE = 'http://localhost:8080/api/items';

    // 메시지 표시
    function showMessage(text, isError = false) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.style.color = isError ? 'red' : 'green';
        setTimeout(() => el.textContent = '', 3000);
    }

    // CREATE: 상품 등록
    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            name: document.getElementById('createName').value,
            price: parseInt(document.getElementById('createPrice').value),
            description: document.getElementById('createDesc').value
        };

        try {
            const response = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const item = await response.json();
                showMessage(`상품 등록 성공! ID: ${item.id}`);
                e.target.reset();
                fetchItems();
            } else {
                const error = await response.json();
                showMessage(error.message, true);
            }
        } catch (err) {
            showMessage('CORS 에러 또는 네트워크 오류: ' + err.message, true);
        }
    });

    // READ: 상품 목록 조회
    async function fetchItems() {
        try {
            const response = await fetch(API_BASE);
            const items = await response.json();

            const tbody = document.getElementById('itemTableBody');
            tbody.innerHTML = items.map(item => `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.price.toLocaleString()}원</td>
                        <td>${item.description || '-'}</td>
                    </tr>
                `).join('');

            showMessage(`${items.length}개 상품 조회 완료`);
        } catch (err) {
            showMessage('CORS 에러 또는 네트워크 오류: ' + err.message, true);
        }
    }

    // UPDATE: 상품 수정
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('updateId').value;
        const data = {
            name: document.getElementById('updateName').value,
            price: parseInt(document.getElementById('updatePrice').value),
            description: document.getElementById('updateDesc').value
        };

        try {
            const response = await fetch(`${API_BASE}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showMessage(`상품 ID ${id} 수정 성공!`);
                e.target.reset();
                fetchItems();
            } else {
                const error = await response.json();
                showMessage(error.message, true);
            }
        } catch (err) {
            showMessage('CORS 에러 또는 네트워크 오류: ' + err.message, true);
        }
    });

    // DELETE: 상품 삭제
    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('deleteId').value;
        if (!confirm(`정말 상품 ID ${id}를 삭제하시겠습니까?`)) return;

        try {
            const response = await fetch(`${API_BASE}/${id}`, {
                method: 'DELETE'
            });

            if (response.status === 204) {
                showMessage(`상품 ID ${id} 삭제 성공!`);
                e.target.reset();
                fetchItems();
            } else {
                const error = await response.json();
                showMessage(error.message, true);
            }
        } catch (err) {
            showMessage('CORS 에러 또는 네트워크 오류: ' + err.message, true);
        }
    });

    // 페이지 로드 시 목록 조회
    fetchItems();
</script>
</body>
</html>
